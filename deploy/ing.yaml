apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: universo-gpt
  namespace: universo-gpt
spec:
  rules:
  - host: universo-gpt.lab.int
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 8501
        path: /
        pathType: Prefix
      - backend:
          service:
            name: universo-gpt
            port:
              number: 5000
        path: /chat
        pathType: Prefix
