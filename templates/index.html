<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sarta GPT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <style>
    body {
      padding: 20px;
    }
    .chat-box {
      height: 300px;
      overflow-y: scroll;
      background-color: #000;
      color: #0F0;
      padding: 10px;
      border: 1px solid #0F0;
    }
    .user {
      color: #FF0;
    }
    .bot {
      color: #0FF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sarta GPT</h1>
    <div class="chat-box" id="chat-box"></div>
    <div class="form-group">
      <input type="text" id="user-input" class="form-control" placeholder="Digite sua mensagem...">
    </div>
    <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
  </div>

  <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value;
      if (!message) return;

      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<div><span class="user">Você:</span> ${message}</div>`;

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      chatBox.innerHTML += `<div><span class="bot">Bot:</span> ${data.reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";
    }
  </script>
</body>
</html>
